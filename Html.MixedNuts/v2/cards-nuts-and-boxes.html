<html>
  <head>
    <link rel="stylesheet" href="../css/mixed-nuts-images.css" />
    <link rel="stylesheet" href="../css/cards-nuts-and-boxes.css" />
    <link rel="stylesheet" href="../SharedWebBoardGame/css/card.css" />
    <link rel="stylesheet" href="../SharedWebBoardGame/css/main.css" />
    <link rel="stylesheet" href="../SharedWebBoardGame/css/image.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chewy&family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <meta content="text/html; charset=UTF-8" http-equiv="content-type" />
    <style type="text/css"></style>
  </head>

  <body id="body">
    <!-- configure Dojo -->
    <script>
      // Instead of using data-dojo-config, we're creating a dojoConfig
      // object *before* we load dojo.js; they're functionally identical,
      // it's just easier to read this approach with a larger configuration.
      var dojoConfig = {
        baseUrl: "..",
        async: true,
        // This code registers the correct location of the "demo"
        // package so we can load Dojo from the CDN whilst still
        // being able to load local modules
        packages: [
          { name: "dojo", location: "../../bower_components/dojo" },
          { name: "javascript", location: "javascript" },
          {
            name: "sharedJavascript",
            location: "SharedWebBoardgame/javascript",
          },
        ],
      };
    </script>
    <!-- load Dojo -->
    <script src="../../../bower_components/dojo/dojo.js"></script>

    <script>
      require([
        "sharedJavascript/cards",
        "sharedJavascript/debugLog",
        "sharedJavascript/genericUtils",
        "sharedJavascript/systemConfigs",
        "javascript/cardsNutsAndBoxesData",
        "javascript/cardsNutsAndBoxes",
      ], function (
        cards,
        debugLog,
        genericUtils,
        systemConfigs,
        cardsNutsAndBoxesData,
        cardsNutsAndBoxes,
      ) {
        var overrides = {};
        var queryParams = genericUtils.getCommonQueryParams();

        if (queryParams.isScreentop) {
          overrides.cardsPerRow = 15;
        }

        var sc = systemConfigs.getCardSystemConfigs(overrides);
        console.log("sc = ", JSON.stringify(sc));
        systemConfigs.setSystemConfigs(sc);
        cardsNutsAndBoxesData.setupCardConfigs();

        cards.addCards(
          cardsNutsAndBoxesData.getNumCards(),
          cardsNutsAndBoxes.addCardFrontAtIndex,
          [
            {
              callback: function (parent, index) {
                cardsNutsAndBoxes.addCardBack(parent, index);
              },
            },
          ],
        );
      });
    </script>
  </body>
</html>
