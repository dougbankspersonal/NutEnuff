<html>
  <head>
    <title>Cards: Nuts Simple</title>
    <link rel="stylesheet" href="../css/images.css" />
    <link rel="stylesheet" href="../css/cards-nuts-simple.css" />
    <link rel="stylesheet" href="../SharedWebBoardGame/css/cards.css" />
    <link rel="stylesheet" href="../SharedWebBoardGame/css/main.css" />
    <link rel="stylesheet" href="../SharedWebBoardGame/css/image.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito+Sans:opsz,wght@6..12,200..1000&display=swap"
      rel="stylesheet"
    />
    <meta content="text/html; charset=UTF-8" http-equiv="content-type" />
    <style type="text/css"></style>
  </head>

  <body id="body">
    <!-- configure Dojo -->
    <script>
      // Instead of using data-dojo-config, we're creating a dojoConfig
      // object *before* we load dojo.js; they're functionally identical,
      // it's just easier to read this approach with a larger configuration.
      var dojoConfig = {
        baseUrl: "..",
        async: true,
        // This code registers the correct location of the "demo"
        // package so we can load Dojo from the CDN whilst still
        // being able to load local modules
        packages: [
          { name: "dojo", location: "../../bower_components/dojo" },
          { name: "javascript", location: "javascript" },
          {
            name: "sharedJavascript",
            location: "SharedWebBoardgame/javascript",
          },
        ],
      };
    </script>
    <!-- load Dojo -->
    <script src="../../../bower_components/dojo/dojo.js"></script>

    <script>
      require([
        "sharedJavascript/cards",
        "sharedJavascript/debugLog",
        "sharedJavascript/genericMeasurements",
        "sharedJavascript/genericUtils",
        "sharedJavascript/systemConfigs",
        "javascript/cardsNutsData",
        "javascript/cardsNutsSimple",
      ], function (
        cards,
        debugLogModule,
        genericMeasurements,
        genericUtils,
        systemConfigs,
        cardsNutsData,
        cardsNutsSimple,
      ) {
        var debugLog = debugLogModule.debugLog;

        var overrides = {};
        var queryParams = genericUtils.getCommonQueryParams();
        if (queryParams.isScreentop) {
          overrides.itemsPerRow = 12;
        }
        overrides.cardHeightPx = genericMeasurements.standardCardWidthPx;
        debugLog("html", "overrides = ", JSON.stringify(overrides));

        var sc = systemConfigs.getCardSystemConfigs(overrides);
        debugLog("html", "sc = ", JSON.stringify(sc));
        systemConfigs.setSystemConfigs(sc);

        cards.addCards(
          cardsNutsData.getNumCards(),
          cardsNutsSimple.addCardFront,
          [
            {
              callback: cardsNutsSimple.addCardBack,
            },
          ],
        );
      });
    </script>
  </body>
  .
</html>
